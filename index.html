<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katherine Shen – Product Designer</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700&family=Syne:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf9f5;--ink:#422821;--green:#698e4a;--foot:#f4e6e6;--sans:'Inter',system-ui,sans-serif;--syne:'Syne',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--sans);overflow-x:hidden}
a{color:inherit}img{display:block;max-width:100%}

/* top bar sits on top of the hero */
.top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:20px clamp(14px,1.7vw,26px);min-height:122px;gap:20px}
.brand img{width:64px;height:64px;object-fit:cover}
.top nav{display:flex;gap:41px;font-size:20px}.top nav a{text-decoration:none}
@media(max-width:900px){.top{min-height:0;padding-block:14px}.brand img{width:48px;height:48px}.top nav{gap:24px}}

/* hero: gradient + clover share one scaled stage so they always stay aligned */
.hero{position:relative;overflow:hidden;height:100vh;height:100svh;display:flex;align-items:center;justify-content:center}
.stage{position:relative;flex:none;width:min(100%,calc(100vh*1.5288));width:min(100%,calc(100svh*1.5288));aspect-ratio:1512/989;container-type:inline-size;transform:translateX(4.53%)}
.grad{position:absolute;left:-.5%;right:-.5%;top:2.022%;bottom:-2.022%;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(233,201,207,.9),#fdf9f5);
  translate:0 calc(var(--py,0)*1px);opacity:0}
@keyframes glowin{from{opacity:0}to{opacity:1}}
.stage.ready .grad,.stage.ready .name{animation:glowin 1.8s ease-out both}
html:not(.js) .grad,html:not(.js) .name,html:not(.js) .tag{opacity:1}
/* clover: rebuilt exactly as in the design (cropped image, rotated 12.23deg) */
.cl{position:absolute;left:47.08%;top:54.71%;width:73.02%;aspect-ratio:1104.043/1078.406;transform:translate(-50%,-50%) scale(1.2,1.1) rotate(12.23deg);pointer-events:none;translate:0 calc(var(--py,0)*1px)}
.cl .clip{position:absolute;inset:0;overflow:hidden}
.cl img{position:absolute;width:104.07%;height:153.32%;left:-4.07%;top:-27.79%;max-width:none}
.name{position:absolute;left:28.145%;top:39.1%;width:34.65%;aspect-ratio:511/152;opacity:0;transition:transform .35s ease-out;will-change:transform}
.name .nm{position:absolute;inset:0;overflow:hidden}
.name img{position:absolute;width:192.81%;height:449.32%;left:-42.81%;top:-119.18%;max-width:none}
.tag{position:absolute;left:49.03%;top:53%;white-space:nowrap;font-size:max(13px,1.25cqw);line-height:normal;opacity:0}
.stage.ready .tag{animation:rise .4s ease 1s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tag span{color:var(--green)}
.stage.ready .tag span{animation:greenin 1.3s ease 1.1s both}
@keyframes greenin{from{color:var(--ink)}to{color:var(--green)}}
@media(max-width:900px){.hero{height:auto;display:block;overflow:visible;overflow-x:clip}.stage{width:900px;margin-left:calc(50% - 409px);transform:none}}

/* case studies */
.cases{padding:48px 8.5vw 135px 11.1vw;position:relative}
.cases h2{font:500 32px/normal var(--syne);margin-bottom:29px}
.cards{display:flex;gap:63px;align-items:flex-start}
.card{position:relative;display:block;flex:1 1 0;min-width:0;max-width:576px;aspect-ratio:576/374;border-radius:30px;text-decoration:none}
.card{container-type:inline-size}
.card .in{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card img{position:absolute;max-width:none}
.card .bg{left:-.868%;top:-1.337%;width:101.736%;height:102.674%}
/* summary note: only shown on hover / keyboard focus (always visible on touch screens) */
.note{position:absolute;height:6.25cqw;display:flex;align-items:center;padding-left:2.604cqw;background:rgba(103,103,103,.8);color:#fff;font:italic 400 2.083cqw/1 var(--sans);border-radius:50px;white-space:nowrap;overflow:hidden;opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
.card:hover .note,.card:focus-visible .note{opacity:1;transform:none}
@media(hover:none){.note{opacity:1;transform:none}}
.card:hover .in,.card:focus-visible .in{transform:scale(1.05)}
.card:focus-visible{outline:3px solid var(--green);outline-offset:6px}
@media(max-width:800px){.cases{padding:40px 20px 80px}.cards{flex-direction:column;gap:28px;align-items:stretch}.card{max-width:576px;width:100%}.cases h2{font-size:26px}}

/* footer */
footer{background:var(--foot);padding:37px clamp(20px,4vw,58px);min-height:219px}
footer h3{font:500 32px var(--syne);display:flex;align-items:center;gap:6px}
footer h3 img{width:47px;transform:rotate(16.8deg)}
footer ul{list-style:none;padding:0;margin-top:18px;display:flex;flex-direction:column;gap:12px;font-size:16px}
footer li{display:flex;align-items:center;gap:11px}
footer li img,footer li svg{width:28px;height:28px}footer li svg{color:#fff}

/* scroll reveal for the case studies block */
.js .cases h2,.js .card{opacity:0;transform:translateY(40px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.js .cases.in h2,.js .cases.in .card{opacity:1;transform:none}
.js .cases.in .card:nth-child(1){transition-delay:.12s}
.js .cases.in .card:nth-child(2){transition-delay:.27s}
@media(prefers-reduced-motion:reduce){.stage.ready .grad,.stage.ready .name,.stage.ready .tag,.stage.ready .tag span{animation:none}.grad,.name,.tag{opacity:1}.name{transition:none}.grad,.cl{translate:none}.card:hover .in{transform:none}.note{transition:none}.js .cases h2,.js .card{opacity:1;transform:none;transition:none}}

<script>
// reveal the case studies as they scroll into view
// Reveal only when scrolling DOWN into view; scrolling up never fades anything out.
const inV=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:0,rootMargin:'0px 0px -2% 0px'});
const offV=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting){e.target.classList.toggle('in',e.boundingClientRect.top<=0)}}),{threshold:0});
const io={observe(el){inV.observe(el);offV.observe(el)}};
io.observe(document.querySelector('.cases'));

// parallax: glow and clover drift slower than the page while the hero scrolls away
{
  const st=document.querySelector('.stage');
  const pics=[...st.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve());
  Promise.race([Promise.all(pics),new Promise(r=>setTimeout(r,3000))]).then(()=>st.classList.add('ready'));
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const stage=document.querySelector('.stage');let ticking=false;
  const update=()=>{ticking=false;const y=Math.min(window.scrollY,window.innerHeight*1.2);stage.style.setProperty('--py',(y*0.25).toFixed(1))};
  addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}},{passive:true});
  update();
}

// hover tilt: the name leans a little toward the pointer (desktop only)
if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&matchMedia('(hover:hover)').matches){
  const nm=document.querySelector('.name');let raf=0,mx=0,my=0;
  const tilt=()=>{raf=0;if(window.scrollY>window.innerHeight){nm.style.transform='';return}
    const dx=Math.max(-1,Math.min(1,(mx/window.innerWidth-.5)*2)),dy=Math.max(-1,Math.min(1,(my/window.innerHeight-.5)*2));
    nm.style.transform='perspective(700px) rotateY('+(dx*10.5).toFixed(2)+'deg) rotateX('+(-dy*7.5).toFixed(2)+'deg)'};
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!raf)raf=requestAnimationFrame(tilt)},{passive:true});
  document.addEventListener('mouseleave',()=>{nm.style.transform=''});
}
</script>
